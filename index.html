<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result Desk – Student Registration and Result Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2.4 9 2.4 12 0v-5"/></svg>
      </div>
      <div>
        <h1>Result Desk</h1>
        <p class="tagline">Register a student, enter marks, and see the result instantly.</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="chip" id="storageChip" role="status"><i></i><span id="storageText">Checking storage…</span></span>
      <button class="theme-btn" id="themeBtn" aria-label="Switch to dark theme" title="Switch theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="layout">

      <!-- Registration form -->
      <section class="card" aria-labelledby="formTitle">
        <h2 id="formTitle">Register student</h2>
        <p class="sub">Fill in the details and marks out of 100 for each subject.</p>

        <form id="studentForm" novalidate>
          <fieldset>
            <legend>Student details</legend>
            <div class="grid-2">
              <div class="field span-2" data-field="name">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" autocomplete="name" value="Munna Thakur" placeholder="e.g. Munna Thakur">
                <p class="err" aria-live="polite"></p>
              </div>
              <div class="field" data-field="roll">
                <label for="roll">Roll number</label>
                <input id="roll" name="roll" type="text" value="CS2026-014" placeholder="e.g. CS2026-014">
                <p class="err" aria-live="polite"></p>
              </div>
              <div class="field" data-field="semester">
                <label for="semester">Semester</label>
                <select id="semester" name="semester">
                  <option value="">Choose semester</option>
                  <option>Semester 1</option><option>Semester 2</option><option>Semester 3</option>
                  <option selected>Semester 4</option><option>Semester 5</option><option>Semester 6</option>
                  <option>Semester 7</option><option>Semester 8</option>
                </select>
                <p class="err" aria-live="polite"></p>
              </div>
              <div class="field span-2" data-field="email">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" value="munna.thakur@example.com" placeholder="name@example.com">
                <p class="err" aria-live="polite"></p>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Marks</legend>
            <div class="grid-2" id="marksGrid"></div>
          </fieldset>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Calculate result</button>
            <button type="button" class="btn btn-ghost" id="resetBtn">Reset form</button>
          </div>
        </form>
      </section>

      <!-- Result -->
      <section class="card" aria-labelledby="resultTitle" aria-live="polite">
        <h2 id="resultTitle" class="visually-hidden" style="position:absolute;left:-9999px">Result</h2>
        <div id="resultArea"></div>
      </section>
    </div>

    <!-- Saved records -->
    <section class="card records" aria-labelledby="recTitle">
      <div class="rec-head">
        <div>
          <h2 id="recTitle">Saved results</h2>
          <p class="sub" style="margin:2px 0 0">Stored as JSON under the key <code>srms.students</code>.</p>
        </div>
        <button class="btn btn-ghost" id="clearBtn" type="button">Clear all</button>
      </div>
      <div class="rec-list" id="recList"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
